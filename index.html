<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore</title>
    <link rel="stylesheet" href="styles.css">

    <meta name="description" content="Discover powerful desktop and Android applications designed and developed by Daniil Dudarchuk.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gcbipdaniil.github.io/">
    <meta property="og:title" content="Daniil Dudarchuk - App Store">
    <meta property="og:description" content="Discover powerful desktop and Android applications designed and developed by Daniil Dudarchuk.">
    <meta name="theme-color" content="#f5f5f7">

    <!-- ANTI-FLASH: применяем тему до первого рендера -->
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <header class="nav-header">
        <div class="nav-content">
            <a href="index.html" class="logo">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/>
                </svg>
                <span data-i18n="store_logo">MyStore</span>
            </a>
            <div class="header-controls">
                <div class="lang-dropdown">
                    <button class="lang-btn">
                        <span class="current-lang-label">PL</span>
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="lang-menu">
                        <button class="lang-option active" data-lang="pl">Polski</button>
                        <button class="lang-option" data-lang="en">English</button>
                        <button class="lang-option" data-lang="ru">Русский</button>
                    </div>
                </div>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1 data-i18n="discover">Discover</h1>
        </div>

        <section class="app-section">
            <h2 data-i18n="desktop_apps">Desktop Apps</h2>
            <div class="app-grid">
                <a href="writerpro.html" class="app-card">
                    <div class="app-icon">
                        <img src="writerpro-icon.png" alt="WriterPro Icon" onerror="this.style.display='none'">
                    </div>
                    <div class="app-info">
                        <h3>WriterPro</h3>
                        <p data-i18n="writerpro_desc">Powerful desktop application for writers</p>
                    </div>
                    <div class="app-action">
                        <button class="get-btn"
                            data-url="https://github.com/gcbipdaniil/WriterPro/releases/download/WriterPro-2.3.6/WriterPro-Setup-2.3.6.exe"
                            data-filename="WriterPro-Setup-2.3.6.exe"
                            data-appname="WriterPro"
                            data-icon="writerpro-icon.png"
                            data-i18n-key="btn_get">
                            <span class="btn-text" data-i18n="btn_get">Get</span>
                        </button>
                    </div>
                </a>
            </div>
        </section>

        <section class="app-section">
            <h2 data-i18n="android_apps">Android Apps</h2>
            <div class="app-grid">
                <a href="mojmck.html" class="app-card">
                    <div class="app-icon">
                        <img src="mojmck-icon.png" alt="MójMCK Icon" onerror="this.style.display='none'">
                    </div>
                    <div class="app-info">
                        <h3>MójMCK</h3>
                        <p data-i18n="mojmck_short_desc">Your digital diary for university life</p>
                    </div>
                    <div class="app-action">
                        <button class="get-btn"
                            data-url="https://github.com/gcbipdaniil/MyMCK/releases/download/M%C3%B3jMCK-2.6/MojMCK.apk"
                            data-filename="MojMCK-2.6.apk"
                            data-appname="MójMCK"
                            data-icon="mojmck-icon.png"
                            data-i18n-key="btn_get">
                            <span class="btn-text" data-i18n="btn_get">Get</span>
                        </button>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p data-i18n="dev_info">Designed and developed by Daniil Dudarchuk</p>
            <div class="contact-links">
                <span data-i18n="contact">Contact:</span>
                <a href="https://t.me/lobstertainment" target="_blank" class="contact-link">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    Telegram
                </a>
                <a href="mailto:daniildudarcuk@gmail.com" class="contact-link">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    Email
                </a>
            </div>
        </div>
    </footer>

    <div id="dl-toast" aria-live="polite">
        <div class="toast-app-icon" id="toast-icon-img"></div>
        <div class="toast-body">
            <div class="toast-name" id="toast-name">App</div>
            <div class="toast-bar-wrap"><div class="toast-bar-fill" id="toast-bar"></div></div>
            <div class="toast-status" id="toast-status">Preparing…</div>
        </div>
        <button class="toast-close" id="toast-close" aria-label="Dismiss">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
